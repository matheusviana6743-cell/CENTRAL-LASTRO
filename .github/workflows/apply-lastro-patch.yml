name: Apply LASTRO patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply and validate
        run: |
          set -e
          awk '/^@@ -3126,56 +3124,19 @@/{exit} {print}' lastro-update.patch > lastro-prefix.patch
          git apply --check lastro-prefix.patch
          git apply lastro-prefix.patch
          git apply --check lastro-tail.patch
          git apply lastro-tail.patch
          python -m py_compile central_lastro.py
          rm -f lastro-update.patch lastro-prefix.patch lastro-tail.patch workflow-trigger.txt

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Update action results and member history'
          git push
