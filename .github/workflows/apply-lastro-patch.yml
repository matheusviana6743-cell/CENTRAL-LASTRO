name: Validate and update LASTRO

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply armament tracking and validate
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('central_lastro.py')
          s = p.read_text(encoding='utf-8')

          # Replace member eligibility selector with armament yes/no.
          s, n = re.subn(
              r'''<div class="field">\s*<label>\s*Participação na divisão\s*</label>\s*<select\s+class="select"\s+data-eligible\s*>\s*<option value="1">[^<]+</option>\s*<option value="0">[^<]+</option>\s*</select>\s*</div>''',
              '''<div class="field">\n                            <label>\n                                Trouxe armamento?\n                            </label>\n                            <select class="select" data-armament>\n                                <option value="NAO">Não</option>\n                                <option value="SIM">Sim</option>\n                            </select>\n                        </div>''',
              s, count=1, flags=re.S
          )

          # Replace member server-side field.
          s = re.sub(
              r'''for mid in member_ids:\s*participant_eligible = request\.form\.get\(\s*f'eligible_\{mid\}',\s*'1'\s*\) == '1'\s*participants\.append\(\s*\(\s*'member',\s*int\(mid\),\s*None,\s*'BANDIDO',\s*participant_eligible\s*\)\s*\)''',
              """for mid in member_ids:\n\n            brought_armament = request.form.get(\n                f'armament_{mid}',\n                'NAO'\n            ).upper() == 'SIM'\n\n            participants.append(\n                (\n                    'member',\n                    int(mid),\n                    None,\n                    'BANDIDO',\n                    brought_armament\n                )\n            )""",
              s, count=1, flags=re.S
          )

          # Replace external eligibility selector.
          s = re.sub(
              r'''<div class="field">\s*<label>\s*Participação na divisão\s*</label>\s*<select\s+class="select"\s+name="external_eligible_\$\{\{i\}\}"\s*>\s*<option value="0">[^<]+</option>\s*<option value="1">[^<]+</option>\s*</select>\s*</div>''',
              '''<div class="field">\n                            <label>\n                                Trouxe armamento?\n                            </label>\n                            <select class="select" name="external_armament_${{i}}">\n                                <option value="NAO">Não</option>\n                                <option value="SIM">Sim</option>\n                            </select>\n                        </div>''',
              s, count=1, flags=re.S
          )

          # Replace external server-side field.
          s = re.sub(
              r'''for i, name in enumerate\(ext_names\):\s*if not name\.strip\(\):\s*continue\s*participant_eligible = request\.form\.get\(\s*f'external_eligible_\{i\}',\s*'1'\s*\) == '1'\s*participants\.append\(\s*\(\s*'external',\s*None,\s*\(\s*name\.strip\(\),\s*ext_pass\[i\]\.strip\(\)\s*if i < len\(ext_pass\)\s*else '',\s*ext_fams\[i\]\.strip\(\)\s*if i < len\(ext_fams\)\s*else ''\s*\),\s*'BANDIDO',\s*participant_eligible\s*\)\s*\)''',
              """for i, name in enumerate(ext_names):\n\n            if not name.strip():\n                continue\n\n            brought_armament = request.form.get(\n                f'external_armament_{i}',\n                'NAO'\n            ).upper() == 'SIM'\n\n            participants.append(\n                (\n                    'external',\n                    None,\n                    (\n                        name.strip(),\n                        ext_pass[i].strip()\n                        if i < len(ext_pass)\n                        else '',\n                        ext_fams[i].strip()\n                        if i < len(ext_fams)\n                        else ''\n                    ),\n                    'BANDIDO',\n                    brought_armament\n                )\n            )""",
              s, count=1, flags=re.S
          )

          # Everyone registered in a won action participates in the 50% pool; armament is informational only.
          s = s.replace(
              "eligible = [\n                x\n                for x in participants\n                if x[4] and result_status == 'GANHADA'\n            ]",
              "eligible = participants if result_status == 'GANHADA' else []",
              1
          )
          s = s.replace(
              'for typ, mid, ext, side, participant_eligible in participants:',
              'for typ, mid, ext, side, brought_armament in participants:',
              1
          )
          s = s.replace(
              "ok = bool(participant_eligible) and result_status == 'GANHADA'",
              "ok = result_status == 'GANHADA'",
              1
          )
          s = s.replace(
              "'Não elegível para a divisão',",
              "'Ação perdida',",
              1
          )
          s = s.replace(
              "                        side,\n                        '',\n                        int(ok),",
              "                        side,\n                        'SIM' if brought_armament else 'NAO',\n                        int(ok),",
              1
          )

          # Sync the dynamically selected member's armament field.
          s = re.sub(
              r'''let eligible =\s*r\.querySelector\(\s*'\[data-eligible\]'\s*\);\s*eligible\.name =\s*'eligible_' \+ s\.value;''',
              """let armament =\n            r.querySelector(\n                '[data-armament]'\n            );\n\n        armament.name =\n            'armament_' + s.value;""",
              s, count=1, flags=re.S
          )

          # Show the armament yes/no flag in result and member history.
          s = s.replace(
              "            ap.value_received,\n            a.name action_name",
              "            ap.value_received,\n            ap.weapon armament,\n            a.name action_name",
              1
          )
          s = s.replace(
              "<td>{money(r['value_received'])}</td>\n            <td>{r['created_at'][:16].replace('T',' ')}</td>",
              "<td>{money(r['value_received'])}</td>\n            <td>{'Sim' if r['armament'] == 'SIM' else 'Não'}</td>\n            <td>{r['created_at'][:16].replace('T',' ')}</td>",
              1
          )
          s = s.replace(
              "<th>Recebeu</th>\n            <th>Data</th>",
              "<th>Recebeu</th>\n            <th>Armamento</th>\n            <th>Data</th>",
              1
          )
          s = s.replace(
              "<td>{money(p[\"value_received\"])}</td>\n            <td>{p[\"reason\"] or \"—\"}</td>",
              "<td>{money(p[\"value_received\"])}</td>\n            <td>{'Sim' if p['weapon'] == 'SIM' else 'Não'}</td>\n            <td>{p[\"reason\"] or \"—\"}</td>",
              1
          )
          s = s.replace(
              "<th>Recebeu</th>\n                <th>Observação</th>",
              "<th>Recebeu</th>\n                <th>Armamento</th>\n                <th>Observação</th>",
              1
          )
          s = s.replace(
              'colspan="5" class="muted">Nenhum participante registrado.',
              'colspan="6" class="muted">Nenhum participante registrado.',
              1
          )

          if 'Participação na divisão' in s or 'data-eligible' in s or 'participant_eligible' in s or 'external_eligible_' in s:
              raise SystemExit('old division/eligibility UI or variable remains')
          if 'armament_' not in s or 'data-armament' not in s:
              raise SystemExit('armament field was not applied')

          p.write_text(s, encoding='utf-8')
          PY
          python3 -m py_compile central_lastro.py

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add central_lastro.py
          git diff --cached --quiet || git commit -m 'Implement armament tracking'
          git push
