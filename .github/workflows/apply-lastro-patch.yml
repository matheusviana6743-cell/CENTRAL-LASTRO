name: Validate and update LASTRO

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply armament tracking
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('central_lastro.py')
          s=p.read_text(encoding='utf-8')

          s=s.replace("""            participant_eligible = request.form.get(\n                f'eligible_{mid}',\n                '1'\n            ) == '1'\n""", """            brought_armament = request.form.get(\n                f'armament_{mid}',\n                'NAO'\n            ).upper() == 'SIM'\n""", 1)
          s=s.replace('participant_eligible\n                )\n            )', 'brought_armament\n                )\n            )', 1)
          s=s.replace("""            participant_eligible = request.form.get(\n                f'external_eligible_{i}',\n                '1'\n            ) == '1'\n""", """            brought_armament = request.form.get(\n                f'external_armament_{i}',\n                'NAO'\n            ).upper() == 'SIM'\n""", 1)
          s=s.replace('participant_eligible\n                )\n            )', 'brought_armament\n                )\n            )', 1)
          s=s.replace("""            eligible = [\n                x\n                for x in participants\n                if x[4] and result_status == 'GANHADA'\n            ]\n""", """            eligible = participants if result_status == 'GANHADA' else []\n""", 1)
          s=s.replace('for typ, mid, ext, side, participant_eligible in participants:', 'for typ, mid, ext, side, brought_armament in participants:', 1)
          s=s.replace("ok = bool(participant_eligible) and result_status == 'GANHADA'", "ok = result_status == 'GANHADA'", 1)
          s=s.replace("'Não elegível para a divisão',", "'Ação perdida',", 1)
          s=s.replace("""                        side,\n                        '',\n                        int(ok),\n""", """                        side,\n                        'SIM' if brought_armament else 'NAO',\n                        int(ok),\n""", 1)

          # Member selector: replace the existing eligibility select, whatever its option labels are.
          marker='data-eligible'
          if marker in s:
              start=s.rfind('<div class="field">',0,s.index(marker))
              end=s.index('</div>',s.index('</select>',s.index(marker)))+6
              s=s[:start]+'''<div class="field">\n                            <label>\n                                Trouxe armamento?\n                            </label>\n                            <select class="select" data-armament>\n                                <option value="NAO">Não</option>\n                                <option value="SIM">Sim</option>\n                            </select>\n                        </div>'''+s[end:]
          s=s.replace("""        let eligible =\n            r.querySelector(\n                '[data-eligible]'\n            );\n\n        eligible.name =\n            'eligible_' + s.value;\n""", """        let armament =\n            r.querySelector(\n                '[data-armament]'\n            );\n\n        armament.name =\n            'armament_' + s.value;\n""", 1)

          # External selector.
          pos=s.find('name="external_eligible_${{i}}"')
          if pos >= 0:
              start=s.rfind('<div class="field">',0,pos)
              end=s.index('</div>',s.index('</select>',pos))+6
              s=s[:start]+'''<div class="field">\n                            <label>\n                                Trouxe armamento?\n                            </label>\n                            <select class="select" name="external_armament_${{i}}">\n                                <option value="NAO">Não</option>\n                                <option value="SIM">Sim</option>\n                            </select>\n                        </div>'''+s[end:]

          # Show yes/no in member history and action result.
          s=s.replace("""            ap.value_received,\n            a.name action_name\n""", """            ap.value_received,\n            ap.weapon armament,\n            a.name action_name\n""", 1)
          s=s.replace("""<td>{money(r['value_received'])}</td>\n            <td>{r['created_at'][:16].replace('T',' ')}</td>""", """<td>{money(r['value_received'])}</td>\n            <td>{'Sim' if r['armament'] == 'SIM' else 'Não'}</td>\n            <td>{r['created_at'][:16].replace('T',' ')}</td>""", 1)
          s=s.replace('<th>Recebeu</th>\n            <th>Data</th>', '<th>Recebeu</th>\n            <th>Armamento</th>\n            <th>Data</th>', 1)
          s=s.replace("""<td>{money(p[\"value_received\"])}</td>\n            <td>{p[\"reason\"] or \"—\"}</td>""", """<td>{money(p[\"value_received\"])}</td>\n            <td>{'Sim' if p['weapon'] == 'SIM' else 'Não'}</td>\n            <td>{p[\"reason\"] or \"—\"}</td>""", 1)
          s=s.replace('<th>Recebeu</th>\n                <th>Observação</th>', '<th>Recebeu</th>\n                <th>Armamento</th>\n                <th>Observação</th>', 1)
          s=s.replace('colspan="5" class="muted">Nenhum participante registrado.', 'colspan="6" class="muted">Nenhum participante registrado.', 1)

          if 'data-eligible' in s or 'external_eligible_' in s or 'participant_eligible' in s:
              raise SystemExit('old eligibility field remains')
          if 'data-armament' not in s or 'external_armament_' not in s:
              raise SystemExit('armament field missing')
          p.write_text(s,encoding='utf-8')
          PY
          python3 -m py_compile central_lastro.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add central_lastro.py
          git diff --cached --quiet || git commit -m 'Implement armament tracking'
          git push
