name: Apply LASTRO updates

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore known-good source and apply dashboard/profile
        env:
          DASHBOARD_B64: 
          PROFILE_B64: 
        run: |
          git show 35d694917a533fba9a5580aabca727d5f9a24c36:central_lastro.py > central_lastro.py
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('central_lastro.py')
          s=p.read_text(encoding='utf-8')
          dashboard=base64.b64decode('${DASHBOARD_B64}').decode('utf-8')
          profile=base64.b64decode('${PROFILE_B64}').decode('utf-8')
          a=s.index("@app.get('/dashboard')")
          b=s.index("# ============================================================\n# FARM", a)
          s=s[:a]+dashboard+s[b:]
          marker="# ============================================================\n# EDITAR MEMBRO"
          pos=s.index(marker)
          s=s[:pos]+profile+s[pos:]
          old="<td>{m['name']}</td>\n                <td>{m['passport'] or '—'}</td>"
          new="<td><a href=\"{url_for('member_profile', member_id=m['id'])}\">{m['name']}</a></td>\n                <td>{m['passport'] or '—'}</td>"
          if old not in s:
              raise SystemExit('member link patch target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 -m py_compile central_lastro.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add central_lastro.py
          git diff --cached --quiet || git commit -m 'feat: merge dashboard with central intelligence and member profiles'
          git push
