name: Apply armament tracking

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore: apply armament tracking [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch action participant fields
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('central_lastro.py')
          s = p.read_text(encoding='utf-8')

          old = '''        for mid in member_ids:\n\n            participant_eligible = request.form.get(\n                f'eligible_{mid}',\n                '1'\n            ) == '1'\n\n            participants.append(\n                (\n                    'member',\n                    int(mid),\n                    None,\n                    'BANDIDO',\n                    participant_eligible\n                )\n            )\n'''
          new = '''        for mid in member_ids:\n\n            brought_armament = request.form.get(\n                f'armament_{mid}',\n                'NAO'\n            ).upper() == 'SIM'\n\n            participants.append(\n                (\n                    'member',\n                    int(mid),\n                    None,\n                    'BANDIDO',\n                    brought_armament\n                )\n            )\n'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''        for i, name in enumerate(ext_names):\n\n            if not name.strip():\n                continue\n\n            participant_eligible = request.form.get(\n                f'external_eligible_{i}',\n                '1'\n            ) == '1'\n\n            participants.append(\n                (\n                    'external',\n                    None,\n                    (\n                        name.strip(),\n                        ext_pass[i].strip()\n                        if i < len(ext_pass)\n                        else '',\n                        ext_fams[i].strip()\n                        if i < len(ext_fams)\n                        else ''\n                    ),\n                    'BANDIDO',\n                    participant_eligible\n                )\n            )\n'''
          new = '''        for i, name in enumerate(ext_names):\n\n            if not name.strip():\n                continue\n\n            brought_armament = request.form.get(\n                f'external_armament_{i}',\n                'NAO'\n            ).upper() == 'SIM'\n\n            participants.append(\n                (\n                    'external',\n                    None,\n                    (\n                        name.strip(),\n                        ext_pass[i].strip()\n                        if i < len(ext_pass)\n                        else '',\n                        ext_fams[i].strip()\n                        if i < len(ext_fams)\n                        else ''\n                    ),\n                    'BANDIDO',\n                    brought_armament\n                )\n            )\n'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''            eligible = [\n                x\n                for x in participants\n                if x[4] and result_status == 'GANHADA'\n            ]\n'''
          new = '''            eligible = participants if result_status == 'GANHADA' else []\n'''
          if old in s:
              s = s.replace(old, new, 1)

          s = s.replace(
              'for typ, mid, ext, side, participant_eligible in participants:',
              'for typ, mid, ext, side, brought_armament in participants:',
              1
          )
          s = s.replace(
              "ok = bool(participant_eligible) and result_status == 'GANHADA'",
              "ok = result_status == 'GANHADA'",
              1
          )
          s = s.replace(
              "'Não elegível para a divisão',",
              "'Ação perdida',",
              1
          )
          s = s.replace(
              "                        side,\n                        '',\n                        int(ok),",
              "                        side,\n                        'SIM' if brought_armament else 'NAO',\n                        int(ok),",
              1
          )

          old = '''                            <label>\n                                Participação na divisão\n                            </label>\n\n                            <select\n                                class="select"\n                                data-eligible\n                            >\n\n                                <option value="1">Participa da divisão</option>\n                                <option value="0">Não participa da divisão</option>\n\n                            </select>\n'''
          new = '''                            <label>\n                                Trouxe armamento?\n                            </label>\n\n                            <select\n                                class="select"\n                                data-armament\n                            >\n\n                                <option value="NAO">Não</option>\n                                <option value="SIM">Sim</option>\n\n                            </select>\n'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''        let eligible =\n            r.querySelector(\n                '[data-eligible]'\n            );\n\n        eligible.name =\n            'eligible_' + s.value;\n'''
          new = '''        let armament =\n            r.querySelector(\n                '[data-armament]'\n            );\n\n        armament.name =\n            'armament_' + s.value;\n'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''                        <div class="field">\n\n                            <label>\n                                Participação na divisão\n                            </label>\n\n                            <select\n                                class="select"\n                                name="external_eligible_${{i}}"\n                            >\n\n                                <option value="1">Participa da divisão</option>\n                                <option value="0">Não participa da divisão</option>\n\n                            </select>\n\n                        </div>\n'''
          new = '''                        <div class="field">\n\n                            <label>\n                                Trouxe armamento?\n                            </label>\n\n                            <select\n                                class="select"\n                                name="external_armament_${{i}}"\n                            >\n\n                                <option value="NAO">Não</option>\n                                <option value="SIM">Sim</option>\n\n                            </select>\n\n                        </div>\n'''
          if old in s:
              s = s.replace(old, new, 1)

          # Show the recorded armament flag in action history/profile without exposing details.
          old = '''            ap.value_received,\n            a.name action_name\n'''
          new = '''            ap.value_received,\n            ap.weapon armament,\n            a.name action_name\n'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''            <td>{money(r['value_received'])}</td>\n            <td>{r['created_at'][:16].replace('T',' ')}</td>\n'''
          new = '''            <td>{money(r['value_received'])}</td>\n            <td>{'Sim' if r['armament'] == 'SIM' else 'Não'}</td>\n            <td>{r['created_at'][:16].replace('T',' ')}</td>\n'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''            <th>Recebeu</th>\n            <th>Data</th>\n'''
          new = '''            <th>Recebeu</th>\n            <th>Armamento</th>\n            <th>Data</th>\n'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''            <td>{money(p["value_received"])}</td>\n            <td>{p["reason"] or "—"}</td>\n'''
          new = '''            <td>{money(p["value_received"])}</td>\n            <td>{'Sim' if p['weapon'] == 'SIM' else 'Não'}</td>\n            <td>{p["reason"] or "—"}</td>\n'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''                <th>Recebeu</th>\n                <th>Observação</th>\n'''
          new = '''                <th>Recebeu</th>\n                <th>Armamento</th>\n                <th>Observação</th>\n'''
          if old in s:
              s = s.replace(old, new, 1)

          s = s.replace(
              'colspan="5" class="muted">Nenhum participante registrado.',
              'colspan="6" class="muted">Nenhum participante registrado.',
              1
          )

          if 'Participação na divisão' in s or 'data-eligible' in s or 'participant_eligible' in s:
              raise SystemExit('old division field still present')
          if "request.form.get(\n                f'armament_" not in s:
              raise SystemExit('member armament field missing')
          if "external_armament_" not in s:
              raise SystemExit('external armament field missing')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate Python
        run: python3 -m py_compile central_lastro.py

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add central_lastro.py
          git diff --cached --quiet && exit 0
          git commit -m 'chore: apply armament tracking [skip ci]'
          git push
